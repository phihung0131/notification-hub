# Test configuration for Tenant Service
spring:
  application:
    name: tenant-service-test

  # H2 in-memory database for tests
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # Disable Redis for unit tests (use MockBean instead)
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: simple # Use simple in-memory cache instead of Redis

  # Kafka test configuration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: tenant-test-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        specific.avro.reader: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer

# gRPC test configuration
grpc:
  server:
    port: 0 # Random port for tests
  client:
    tenant-service:
      address: static://localhost:9090
      negotiationType: PLAINTEXT

# JWT test configuration
jwt:
  secret: test-secret-key-for-unit-tests-only-must-be-at-least-256-bits-long
  expiration: 3600000 # 1 hour for tests

# Logging
logging:
  level:
    root: WARN
    org.example.tenantservice: INFO
    org.springframework.test: INFO
