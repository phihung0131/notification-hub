# Provider mocks for delivery-service. Use together with the main file:
#   docker compose -f compose.yaml -f compose.providers.yaml up -d
# Mailpit (SMTP :1025, UI :8025) is already defined in compose.yaml; delivery-service
# defaults to MAIL_HOST=mailpit, so email works with no extra wiring.
services:
  mock-provider:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["node", "--max-old-space-size=48", "server.js"]
    environment:
      PORT: 8090
      # delivery-service webhook endpoint (path = context-path + /webhooks/provider)
      WEBHOOK_URL: http://delivery-service:8080/api/v1/delivery/webhooks/provider
      WEBHOOK_SECRET: ${DELIVERY_WEBHOOK_SECRET:-dev-webhook-secret}
    volumes:
      - ./providers/mock-provider/server.js:/app/server.js:ro
    ports: ["8090:8090"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 96m

  delivery-service:
    depends_on:
      mock-provider: {condition: service_healthy}
    environment:
      PROVIDER_SMS_URL: http://mock-provider:8090
      PROVIDER_PUSH_URL: http://mock-provider:8090
      PROVIDER_CHAT_URL: http://mock-provider:8090
      PROVIDER_DEFAULT_URL: http://mock-provider:8090
      DELIVERY_WEBHOOK_SECRET: ${DELIVERY_WEBHOOK_SECRET:-dev-webhook-secret}
