spring:
  application:
    name: analytics-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    time-zone: UTC
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    properties:
      schema.registry.url: ${SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        auto.register.schemas: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID}
      properties:
        specific.avro.reader: true
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: ${ANALYTICS_BATCH_SIZE:500}
    listener:
      type: batch
      ack-mode: manual
      concurrency: ${ANALYTICS_CONSUMER_CONCURRENCY:1}

server:
  port: 8080
  servlet:
    context-path: /api/v1/analytics

grpc:
  server:
    port: 9090

# Management & Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info,env

  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
      environment: development

# Logging Configuration
logging:
  level:
    root: INFO
    org.example.analyticsservice: DEBUG
    org.springframework.kafka: WARN

app:
  kafka:
    topic:
      requested: notification.requested
      result: notification.result
