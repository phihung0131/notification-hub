global:
  scrape_interval: 5s
scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["gateway-service:8080"]}]
  - job_name: tenant
    metrics_path: /api/v1/tenants/actuator/prometheus
    static_configs: [{targets: ["tenant-service:8080"]}]
  - job_name: notification
    metrics_path: /api/v1/notifications/actuator/prometheus
    static_configs: [{targets: ["notification-service:8080"]}]
  - job_name: delivery
    metrics_path: /api/v1/delivery/actuator/prometheus
    static_configs: [{targets: ["delivery-service:8080"]}]
  - job_name: analytics
    metrics_path: /api/v1/analytics/actuator/prometheus
    static_configs: [{targets: ["analytics-service:8080"]}]
